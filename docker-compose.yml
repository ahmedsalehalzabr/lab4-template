version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: program
      POSTGRES_PASSWORD: test
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U program -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build: ./Gateway
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      warehouse-service:
        condition: service_started

  user-service:
    build: ./UserService
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./OrderService
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      postgres:
        condition: service_healthy

  warehouse-service:
    build: ./WarehouseService
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: