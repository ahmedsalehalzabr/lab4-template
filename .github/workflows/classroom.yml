name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET services
        run: |
          dotnet build Gateway/Gateway.csproj
          dotnet build UserService/UserService.csproj
          dotnet build OrderService/OrderService.csproj
          dotnet build WarehouseService/WarehouseService.csproj

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/users/manage/health | grep -q "200" && \
               curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/orders/manage/health | grep -q "200" && \
               curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/warehouse/manage/health | grep -q "200"; then
              echo "All services are healthy!"
              exit 0
            fi
            echo "Attempt $i/60: services not ready yet, waiting..."
            sleep 5
          done
          echo "ERROR: Services did not become healthy in time"
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Tests
        run: |
          cd v1/postman
          newman run collection.json -e environment.json

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true